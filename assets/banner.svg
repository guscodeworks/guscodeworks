<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="360" fill="#0D1117"/>

  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>

    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 80) rotate(35) scale(340 220)">
      <stop stop-color="#1F6FEB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 280) rotate(-15) scale(360 240)">
      <stop stop-color="#00C2A8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#leftGlow)"/>
  <rect width="1280" height="360" fill="url(#rightGlow)"/>

  <rect x="58" y="54" width="1164" height="252" rx="28" fill="#0B1220" stroke="#263241" filter="url(#softShadow)"/>
  <rect x="58" y="54" width="1164" height="252" rx="28" stroke="url(#bgGlow)" stroke-opacity="0.26"/>

  <text x="102" y="132" fill="#E6EDF3" font-size="40" font-family="Arial, sans-serif" font-weight="700">
    Gustavo Nascimento
  </text>

  <text x="102" y="178" fill="#58A6FF" font-size="24" font-family="Arial, sans-serif" font-weight="500">
    Desenvolvedor Back-End
  </text>

  <text x="102" y="232" fill="#C9D1D9" font-size="20" font-family="Arial, sans-serif">
    Soluções bem estruturadas, com clareza e consistência.
  </text>

  <line x1="102" y1="258" x2="420" y2="258" stroke="#263241" stroke-width="1"/>

  <rect x="720" y="80" width="430" height="190" rx="22" fill="#121821" stroke="#2B3542"/>

  <circle cx="754" cy="108" r="7" fill="#FF5F56"/>
  <circle cx="780" cy="108" r="7" fill="#FFBD2E"/>
  <circle cx="806" cy="108" r="7" fill="#27C93F"/>

  <text x="782" y="146" fill="#D946EF" font-size="17" font-family="monospace" font-weight="600">while</text>
  <text x="842" y="146" fill="#E6EDF3" font-size="17" font-family="monospace">(</text>
  <text x="852" y="146" fill="#22C55E" font-size="17" font-family="monospace" font-weight="600">building</text>
  <text x="934" y="146" fill="#E6EDF3" font-size="17" font-family="monospace">) {</text>

  <text x="818" y="176" fill="#7DD3FC" font-size="17" font-family="monospace" font-weight="600">learn</text>
  <text x="868" y="176" fill="#E6EDF3" font-size="17" font-family="monospace">();</text>

  <text x="818" y="206" fill="#22C55E" font-size="17" font-family="monospace" font-weight="600">code</text>
  <text x="860" y="206" fill="#E6EDF3" font-size="17" font-family="monospace">();</text>

  <text x="818" y="236" fill="#F59E0B" font-size="17" font-family="monospace" font-weight="600">improve</text>
  <text x="886" y="236" fill="#E6EDF3" font-size="17" font-family="monospace">();</text>

  <text x="782" y="262" fill="#E6EDF3" font-size="17" font-family="monospace">}</text>

  <circle cx="1128" cy="88" r="4" fill="#58A6FF">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1148" cy="88" r="4" fill="#00C2A8">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="102" y="276" width="170" height="3" rx="2" fill="url(#bgGlow)">
    <animate attributeName="width" values="120;220;120" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>