<svg width="1280" height="390" viewBox="0 0 1280 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="390" rx="28" fill="#070B16"/>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="390">
      <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect x="20" y="20" width="1240" height="350" rx="24" stroke="url(#line)" stroke-width="2" opacity="0.65"/>
  <circle cx="240" cy="80" r="100" fill="#1D4ED8" opacity="0.22" filter="url(#glow)">
    <animate attributeName="cx" values="240;320;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="310" r="120" fill="#7C3AED" opacity="0.22" filter="url(#glow)">
    <animate attributeName="cy" values="310;250;310" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- pixel stars -->
  <g opacity="0.75">
    <rect x="80" y="70" width="10" height="10" fill="#38BDF8"/>
    <rect x="210" y="130" width="8" height="8" fill="#8B5CF6"/>
    <rect x="1030" y="80" width="10" height="10" fill="#10B981"/>
    <rect x="1120" y="150" width="8" height="8" fill="#38BDF8"/>
    <rect x="770" y="65" width="8" height="8" fill="#8B5CF6"/>
  </g>

  <!-- desk -->
  <rect x="360" y="285" width="560" height="18" fill="#334155"/>
  <rect x="390" y="303" width="28" height="48" fill="#1F2937"/>
  <rect x="860" y="303" width="28" height="48" fill="#1F2937"/>

  <!-- monitor -->
  <rect x="465" y="115" width="350" height="190" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <rect x="490" y="145" width="300" height="132" fill="#111827"/>
  <rect x="520" y="170" width="80" height="10" fill="#58A6FF"/>
  <rect x="520" y="197" width="185" height="9" fill="#8B949E"/>
  <rect x="520" y="224" width="135" height="9" fill="#10B981"/>
  <rect x="520" y="251" width="230" height="9" fill="#8B5CF6"/>
  <rect x="610" y="306" width="58" height="34" fill="#1F2937"/>
  <rect x="570" y="340" width="140" height="12" fill="#334155"/>

  <!-- backend cards -->
  <g font-family="monospace" font-size="18" font-weight="700">
    <rect x="96" y="190" width="170" height="52" rx="10" fill="#111827" stroke="#30363D"/>
    <text x="181" y="224" text-anchor="middle" fill="#58A6FF">REST APIs</text>
    <rect x="960" y="120" width="180" height="52" rx="10" fill="#111827" stroke="#30363D"/>
    <text x="1050" y="154" text-anchor="middle" fill="#10B981">DATABASES</text>
    <rect x="940" y="235" width="170" height="52" rx="10" fill="#111827" stroke="#30363D"/>
    <text x="1025" y="269" text-anchor="middle" fill="#A78BFA">BACK-END</text>
  </g>

  <!-- avatar pixel style -->
  <rect x="600" y="88" width="80" height="20" fill="#1E293B"/>
  <rect x="580" y="108" width="120" height="80" fill="#111827"/>
  <rect x="600" y="128" width="80" height="60" fill="#C084FC" opacity="0.9"/>
  <rect x="620" y="150" width="12" height="12" fill="#0D1117"/>
  <rect x="648" y="150" width="12" height="12" fill="#0D1117"/>
  <rect x="625" y="172" width="30" height="8" fill="#0D1117"/>

  <!-- animated cursor -->
  <rect x="755" y="249" width="12" height="20" fill="#58A6FF">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="64" text-anchor="middle" fill="#E6EDF3" font-family="Arial, sans-serif" font-size="28" font-weight="700">Building Back-End Solutions</text>
</svg>
